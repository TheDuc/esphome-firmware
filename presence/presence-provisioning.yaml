substitutions:
  name: presence-provisioning
  friendly_name: Presence

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.11.0
  project:
    name: esphome.web
    version: 0.0.1
  platformio_options:
    board_build.f_cpu: 80000000  # 80 MHz

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:
  # baud_rate: 0

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome
  id: ota_esphome
- platform: http_request
  id: ota_http_request

http_request:
  verify_ssl: false

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: https://raw.githubusercontent.com/TheDuc/esphome-firmware/main/presence/manifest.json
    update_interval: 1min

    on_update_available:
      then:
        - logger.log: "Update available — performing update now"
        - update.perform: firmware_update

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dB

  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/firmware/esphome-web/esp32c3.yaml@main
  import_full_config: true

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
# esp32_improv:
#   authorizer: none

# To have a "next url" for improv serial
web_server:

output:
  - platform: gpio
    pin:
      number: GPIO8   # ESP32-C3 SuperMini built-in LED
      inverted: true  # active-low LED
    id: builtin_led

switch:
  - platform: output
    name: "${friendly_name} Built-in LED"
    output: builtin_led
    restore_mode: RESTORE_DEFAULT_ON  # remembers last state across reboot
  - platform: ld2412
    engineering_mode:
      name: Engineering Mode
    bluetooth:
      name: Bluetooth

########################################
# LD2412 CONFIGURATION
########################################

uart:
  id: uart_ld2412
  rx_pin: 
    number: GPIO20
    mode:
      input: true
      pullup: true
  tx_pin: 
    number: GPIO21
    mode:
      input: true
      pullup: true
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

ld2412:
  uart_id: uart_ld2412

binary_sensor:
  - platform: ld2412
    has_target:
      name: "${friendly_name} Presence"

    has_moving_target:
      name: "${friendly_name} Moving Target"

    has_still_target:
      name: "${friendly_name} Still Target"

sensor:
  - platform: ld2412
    moving_distance:
      name: "${friendly_name} Moving Distance"

    still_distance:
      name: "${friendly_name} Still Distance"

    moving_energy:
      name: "${friendly_name} Moving Energy"

    still_energy:
      name: "${friendly_name} Still Energy"

    detection_distance:
      name: "${friendly_name} Detection Distance"

number:
  - platform: ld2412
    timeout:
      name: Presence Timeout
    min_distance_gate:
      name: Minimum Distance Gate
    max_distance_gate:
      name: Maximum Distance Gate
    light_threshold:
      name: Light Threshold
    gate_0:
