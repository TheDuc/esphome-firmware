substitutions:
  name: rfid_reader
  friendly_name: RFID Reader

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.11.0
  project:
    name: esphome.web
    version: 0.0.1
  on_boot:
    priority: -100
    then:
      - light.turn_off: light_builtin

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  actions:
    - action: rtttl_play
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

# Allow Over-The-Air updates
ota:
- platform: esphome
  id: ota_esphome
- platform: http_request
  id: ota_http_request

http_request:
  verify_ssl: false

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: https://raw.githubusercontent.com/TheDuc/esphome-firmware/main/rfid_reader/manifest.json
    update_interval: 6h
    internal: true

    on_update_available:
      then:
        - logger.log: "Update available — performing update now"
        - update.perform: firmware_update

# Allow provisioning Wi-Fi via serial
# improv_serial:

wifi:
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  power_save_mode: LIGHT
  output_power: 8.5dB
  # fast_connect: true

  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/firmware/esphome-web/esp32c3.yaml@main
  import_full_config: true

globals:
  - id: auto_beep_on_scan
    type: bool
    restore_value: true
    initial_value: "true"

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO06
    num_leds: 1
    chipset: ws2812
    name: "Light"
  - platform: binary
    id: light_builtin
    output: builtin_led

output:
  - platform: ledc
    pin: GPIO05
    id: rtttl_out
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true   # because LED is active-low
    id: builtin_led

rtttl:
  output: rtttl_out

spi:
  clk_pin: GPIO04
  mosi_pin: GPIO09
  miso_pin: GPIO10
  interface: hardware

switch:
  - platform: template
    name: "RFID Auto Beep"
    icon: "mdi:volume-high"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(auto_beep_on_scan);
    turn_on_action:
      - lambda: |-
          id(auto_beep_on_scan) = true;
    turn_off_action:
      - lambda: |-
          id(auto_beep_on_scan) = false;

pn532_spi:
  cs_pin: GPIO07
  on_tag:
    then:
      - homeassistant.tag_scanned: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return id(auto_beep_on_scan);'
          then:
            - rtttl.play: "beep:d=16,o=6,b=120:c6"
